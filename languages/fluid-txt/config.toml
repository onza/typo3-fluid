name = "Fluid Text"
grammar = "fluid"
path_suffixes = ["fluid.txt"]
first_line_pattern = "(?i)(xmlns:f\\s*=|data-namespace-typo3-fluid|\\{namespace\\s|<f:[a-zA-Z])"
language_servers = ["fluid-lsp"]
block_comment = ["{*", "*}"]
tab_size = 2
autoclose_before = "}];>"
brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
