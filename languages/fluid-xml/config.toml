name = "Fluid XML"
grammar = "fluid"
path_suffixes = ["fluid.xml"]
language_servers = ["fluid-lsp"]
block_comment = ["{*", "*}"]
tab_size = 2
autoclose_before = "}];>"
brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
  { start = "<", end = ">", close = false, newline = true },
]
